baseURL: https://hannnnn13.github.io/POPPOP/
title: WHO AM I?
locale: ko-KR
defaultContentLanguage: ko

copyright: "© 2026 밤걷. All rights reserved."
enableRobotsTXT: true

pagination:
  pagerSize: 12

outputs:
  home:
    - HTML
    - RSS
    - JSON

taxonomies:
  tag: tags
  topic: topics
  category: categories

menu:
  main:
    - identifier: about
      name: 소개
      url: /about/
      weight: 10
      params:
        secondary: 관심 분야, 목표와 계획, 사용해 본 기술
    - identifier: projects
      name: 프로젝트
      url: /projects/
      weight: 20
      params:
        secondary: 포트폴리오 사이트, 수업 실습, 개인 프로젝트
    - identifier: notes
      name: 학습 기록
      url: /notes/
      weight: 30
      params:
        secondary: Git, 개발 환경 구축 정리 및 메모
    - identifier: search
      name: 검색
      url: /search/
      weight: 40

params:
  author: 밤걷
  description: 전북대 컴퓨터인공지능학부에 재학 중인 2학년 밤걷입니다.
  defaultTheme: auto
  disableThemeToggle: false
  disableSpecial1stPost: true
  mainSections:
    - projects
    - notes
  ShowReadingTime: true
  ShowBreadCrumbs: true
  ShowPostNavLinks: true
  ShowCodeCopyButtons: true
  ShowShareButtons: false
  hideAuthor: true
  footer:
    hideCopyright: false
    hidePoweredBy: true
    text: "Made with [No Fate](https://github.com/OliverObst/no-fate) by [Oliver Obst](https://oliver.obst.eu/) and [Hugo](https://gohugo.io/)."
  label:
    text: "메인으로 돌아가기"
  noFate:
    style: wild
    defaultMode: editorial
    defaultAccent: signal
    showThemeToggle: true
    showSearch: true
    showReadingTime: true
    showPropositions: true
    enableImageProcessing: true
    validateContentModel: true
    strictHomeSelections: true
    wild:
      masthead: "밤걷의 포트폴리오"
      issue: "2026 / 개인 소개 및 프로젝트"
    home:
      featuredProposition:
    archive:
      showArtefactNumbers: true
      showRights: true
    images:
      widths:
        - 480
        - 800
        - 1200
        - 1600
      webpQuality: 82
    record:
      dataFile: record
      enableClientFilters: true
      selectedGroupBy: collection
      filterFields:
        - year
        - type
        - topic
      highlightCreators:
        - 밤걷
      showAbstracts: false

markup:
  goldmark:
    extensions:
      passthrough:
        delimiters:
          block:
            - ['\[', '\]']
            - ['$$', '$$']
          inline:
            - ['\(', '\)']
        enable: true
    parser:
      wrapStandAloneImageWithinParagraph: false
      attribute:
        block: true
        title: true
    renderer:
      unsafe: false
